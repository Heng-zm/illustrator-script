name: Release Automation

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional manual version override (e.g. 2.7.0). If blank, auto-increments.'
        required: false
        default: ''
      bump:
        description: 'Version bump type if auto-incrementing'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine Version & Auto-Bump
        id: get_version
        shell: pwsh
        run: |
          # 1. Fetch all tags from remote to ensure complete tag history
          git fetch --tags --force

          # Tag creation (step 6) needs a committer identity even when no version
          # bump is required, so configure it once up front.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Single source of truth: version.json
          $versionFile = "version.json"
          if (-not (Test-Path -LiteralPath $versionFile)) {
            throw "version.json not found"
          }
          $vObj = Get-Content -LiteralPath $versionFile -Raw | ConvertFrom-Json
          $ver = [string]$vObj.version
          $ver = $ver.Trim()
          if ($ver.StartsWith('v', [System.StringComparison]::OrdinalIgnoreCase)) {
            $ver = $ver.Substring(1)
          }

          # 3. Handle manual input override (from workflow_dispatch)
          $inputVer = "${{ github.event.inputs.version }}".Trim()
          if ($inputVer) {
            if ($inputVer.StartsWith('v', [System.StringComparison]::OrdinalIgnoreCase)) {
              $inputVer = $inputVer.Substring(1)
            }
            $ver = $inputVer
          }

          $bumpType = "${{ github.event.inputs.bump }}"
          if (-not $bumpType) { $bumpType = "patch" }

          # 4. Check whether we are on a tag push or branch push
          $isTagPush = "${{ github.ref }}".StartsWith("refs/tags/")
          $headSha = (& git rev-parse HEAD).Trim()
          $tagRef = "v$ver"

          $bumpNeeded = $false

          if ($isTagPush) {
            $refName = "${{ github.ref_name }}"
            if ($refName -match '^[vV](.+)$') {
              $ver = $matches[1]
              $tagRef = "v$ver"
            }
            Write-Host "Triggered by tag push: $tagRef on commit $headSha"
            if ($vObj.version -ne $ver) {
              $bumpNeeded = $true
            }
          } else {
            $tagExists = [bool](& git tag -l $tagRef)
            if ($tagExists) {
              $tagSha = (& git rev-list -n 1 $tagRef).Trim()
              if ($tagSha -ne $headSha) {
                Write-Host "Tag $tagRef already exists on older commit $tagSha (HEAD is $headSha)."
                Write-Host "Auto-incrementing $bumpType version for new push..."

                $parts = $ver.Split('.')
                $major = [int]$parts[0]
                $minor = [int]$parts[1]
                $patch = [int]$parts[2]

                if ($bumpType -eq "major") {
                  $major++
                  $minor = 0
                  $patch = 0
                } elseif ($bumpType -eq "minor") {
                  $minor++
                  $patch = 0
                } else {
                  $patch++
                }
                $ver = "$major.$minor.$patch"
                $tagRef = "v$ver"

                while ([bool](& git tag -l $tagRef)) {
                  $patch++
                  $ver = "$major.$minor.$patch"
                  $tagRef = "v$ver"
                }

                Write-Host "Determined next auto-version: $ver ($tagRef)"
                $bumpNeeded = $true
              } else {
                Write-Host "Tag $tagRef already points to HEAD ($headSha). Re-building existing release."
              }
            } else {
              Write-Host "New version $ver ($tagRef) detected (no existing tag)."
              if ($vObj.version -ne $ver) {
                $bumpNeeded = $true
              }
            }
          }

          # 5. If version was bumped, update version.json, sync metadata, and commit
          if ($bumpNeeded) {
            Write-Host "Updating version.json to $ver and synchronizing repository metadata..."
            $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
            $newJson = "{`n  `"version`": `"$ver`"`n}`n"
            [System.IO.File]::WriteAllText((Join-Path (Get-Location) "version.json"), $newJson, $utf8NoBom)

            & .\sync-version.ps1

            git add -A
            git commit -m "chore(release): bump version to v$ver [skip ci]"

            if (-not $isTagPush) {
              Write-Host "Pushing version bump commit to main..."
              try {
                git push origin HEAD:main
              } catch {
                Write-Warning "Could not push version bump commit to main (check branch protection): $_"
              }
            }

            $headSha = (& git rev-parse HEAD).Trim()
          }

          # 6. Ensure tag exists on remote
          $tagExistsOnRemote = [bool](& git tag -l $tagRef)
          if (-not $tagExistsOnRemote) {
            Write-Host "Creating git tag $tagRef at $headSha..."
            git tag -a $tagRef -m "Release $tagRef" $headSha
            git push origin $tagRef
          }

          Write-Host "Release Version: $ver"
          Write-Host "Release Tag: $tagRef"
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag_name=$tagRef" >> $env:GITHUB_OUTPUT

      - name: Verify Version Consistency
        shell: pwsh
        run: .\sync-version.ps1 -Check

      - name: Syntax Check (ExtendScript & panel)
        shell: pwsh
        run: node tools/check-syntax.js

      - name: Host Bridge Unit Tests
        shell: pwsh
        run: node tools/test-hostscript.js

      - name: Build Release Package (.zip)
        shell: pwsh
        run: |
          .\build-release.ps1 -Version "${{ steps.get_version.outputs.version }}"

      - name: Verify Package Archive
        shell: pwsh
        run: |
          $zip = Get-Item "release\Ozo-Tools-*.zip"
          if (-not $zip) {
            Write-Error "Release zip package was not generated!"
            exit 1
          }
          Write-Host "Ready to publish: $($zip.FullName) ($($zip.Length) bytes)"

      - name: Publish Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: Ozo Tools ${{ steps.get_version.outputs.tag_name }}
          files: release/Ozo-Tools-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
