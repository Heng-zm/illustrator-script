name: Release Automation

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional override; must match version.json'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          # version.json is the single source of truth.
          $versionFile = "version.json"
          if (-not (Test-Path -LiteralPath $versionFile)) {
            throw "version.json not found"
          }
          $ver = [string]((Get-Content -LiteralPath $versionFile -Raw | ConvertFrom-Json).version)
          $inputVersion = "${{ github.event.inputs.version }}"
          if ($inputVersion) { $ver = $inputVersion }
          $ver = $ver.Trim()
          if ($ver.StartsWith('v', [System.StringComparison]::OrdinalIgnoreCase)) {
            $ver = $ver.Substring(1)
          }
          if ($ver -notmatch '^\d+\.\d+\.\d+$') {
            throw "version.json must contain a semantic version (found '$ver')"
          }

          # A v* tag must agree with version.json, otherwise the release would
          # publish one version while the panel reports another.
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^[vV](.+)$' -and $matches[1] -ne $ver) {
            throw "Tag $ref does not match version.json ($ver). Bump version.json before tagging."
          }

          Write-Host "Determined Version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag_name=v$ver" >> $env:GITHUB_OUTPUT

      - name: Verify Version Consistency
        shell: pwsh
        run: .\sync-version.ps1 -Check

      - name: Syntax Check (ExtendScript & panel)
        shell: pwsh
        run: node tools/check-syntax.js

      - name: Build Release Package (.zip)
        shell: pwsh
        run: |
          .\build-release.ps1 -Version "${{ steps.get_version.outputs.version }}"

      - name: Verify Package Archive
        shell: pwsh
        run: |
          $zip = Get-Item "release\Ozo-Tools-*.zip"
          if (-not $zip) {
            Write-Error "Release zip package was not generated!"
            exit 1
          }
          Write-Host "Ready to publish: $($zip.FullName) ($($zip.Length) bytes)"

      - name: Publish Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: Ozo Tools ${{ steps.get_version.outputs.tag_name }}
          files: release/Ozo-Tools-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
