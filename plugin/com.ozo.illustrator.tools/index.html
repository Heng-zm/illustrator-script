<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Ozo Tools</title>
    <link rel="icon" type="image/png" href="assets/icon-normal.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Floating Pro Toast Notification -->
    <div id="toastNotification" class="toast-notification" hidden role="alert" aria-live="assertive">
        <div class="toast-inner">
            <span id="toastIcon" class="toast-icon"></span>
            <span id="toastText" class="toast-text"></span>
            <button type="button" id="toastActionBtn" class="toast-action-btn" hidden></button>
            <button type="button" id="toastDismissBtn" class="toast-dismiss" aria-label="Dismiss">&times;</button>
        </div>
        <div class="toast-bar-track">
            <div id="toastBar" class="toast-bar"></div>
        </div>
    </div>
    <!-- Welcome Splash Screen (decorative; auto-dismisses, not a real modal) -->
    <div id="welcomeSplash" class="welcome-splash" role="status" aria-live="polite">
        <div class="splash-card">
            <div class="splash-logo-wrap">
                <div class="splash-logo-glow"></div>
                <img src="assets/logo-square.png" class="splash-logo" alt="Ozo Tools" draggable="false">
            </div>
            <div class="splash-brand">
                <span class="splash-title">OZO TOOLS</span>
                <span id="splashVersion" class="splash-badge"></span>
            </div>
            <p class="splash-subtitle" data-i18n="splash.subtitle">Illustrator Automation Suite</p>
            <div class="splash-progress-track">
                <div class="splash-progress-bar"></div>
            </div>
            <div class="splash-status" data-i18n="splash.status">Ready &bull; 13 tools available</div>
        </div>
    </div>

    <!-- All visible text is owned by js/main.js (data-i18n* attributes); the English below is the no-JS fallback. -->

    <!-- Top Header -->
    <header class="panel-header">
        <div class="brand">
            <img src="assets/logo-square.png" class="brand-logo" alt="Ozo Tools" draggable="false">
            <span class="brand-title">OZO TOOLS</span>
        </div>
        <div class="header-actions" role="toolbar">
            <button type="button" id="langToggleBtn" class="lang-btn" data-i18n-title="lang.toggle" title="Switch language">EN</button>
            <span class="header-sep" aria-hidden="true"></span>
            <button type="button" id="openFolderBtn" class="icon-btn" data-i18n-title="folder" title="Open Scripts Directory">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            </button>
            <button type="button" id="refreshBtn" class="icon-btn" data-i18n-title="refresh" title="Refresh Panel">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v4.5h-4.5"/></svg>
            </button>
            <button type="button" id="densityToggleBtn" class="icon-btn" data-i18n-title="density.toggle" title="Toggle Compact / Comfortable View (Alt+D)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg>
            </button>
            <button type="button" id="shortcutsBtn" class="icon-btn" data-i18n-title="shortcuts.title" title="Keyboard Shortcuts (?)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M7 14h10"/></svg>
            </button>
        </div>
    </header>

    <!-- Update Notification Banner -->
    <div id="updateBanner" class="update-banner" hidden>
        <div class="update-banner-content">
            <span class="update-icon" aria-hidden="true">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            </span>
            <span class="update-text" id="updateBannerText"></span>
        </div>
        <div class="update-banner-actions">
            <button type="button" id="updateNowBtn" class="update-btn" data-i18n-title="update.btnTitle" title="Download & update to latest release">Update</button>
            <button type="button" id="updateDismissBtn" class="update-dismiss" data-i18n-title="update.dismiss" title="Dismiss notification">&times;</button>
        </div>
    </div>

    <!-- Script / update alert banner -->
    <div id="errorBanner" class="error-banner banner-alert-error" role="alert" hidden>
        <span id="errorBannerIcon" class="error-banner-icon" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </span>
        <div class="error-banner-body">
            <strong id="errorTitle" class="error-banner-title"></strong>
            <div id="errorMessage" class="error-banner-message"></div>
        </div>
        <div class="error-banner-actions">
            <button type="button" id="errorCopyBtn" class="error-copy-btn" title="Copy message">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
            <button type="button" id="errorDismissBtn" class="update-dismiss" data-i18n-title="dismiss" title="Dismiss">&times;</button>
        </div>
    </div>

    <!-- Catalog View (Tools Grid / List) -->
    <div id="viewCatalog" class="view-catalog">
        <!-- Search Input -->
        <div class="search-container" role="search">
            <div class="search-input-wrap">
                <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                <input type="text" id="searchInput" class="search-input" autocomplete="off" autocapitalize="off" spellcheck="false" data-i18n-placeholder="search.placeholder" placeholder="Search tools...">
                <kbd id="searchKbdHint" aria-hidden="true" class="search-kbd" data-i18n-title="search.hint" title="Press / to search">/</kbd>
                <button type="button" id="searchClearBtn" class="search-clear" data-i18n-title="search.clear" title="Clear search">&times;</button>
            </div>
            <button type="button" id="viewToggleBtn" class="icon-btn view-toggle" aria-pressed="false" data-i18n-title="view.toggle" title="Toggle Grid / List View">
                <svg id="viewIconGrid" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
                <svg id="viewIconList" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none;"><rect x="3.5" y="4" width="17" height="4.5" rx="1.6"/><rect x="3.5" y="10" width="17" height="4.5" rx="1.6"/><rect x="3.5" y="16" width="17" height="4.5" rx="1.6"/></svg>
            </button>
        </div>

        <!-- Quick Filter Chips -->
            <div id="searchTagsWrap" class="search-tags-wrap" hidden>
                <span class="search-tag tag-fav" data-query=":favorites"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg><span>Favorites</span></span>
                <span class="search-tag tag-all" data-query=""><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></svg><span>All</span></span>
                <span class="search-tag" data-query="die cut"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/></svg><span>DieCut</span></span>
                <span class="search-tag" data-query="qr"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM19 19h2"/></svg><span>QR</span></span>
                <span class="search-tag" data-query="export"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg><span>Export</span></span>
                <span class="search-tag" data-query="guide"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h18M3 15h18M9 3v18M15 3v18" stroke-dasharray="2 2"/></svg><span>Guides</span></span>
                <span class="search-tag" data-query="black"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg><span>Rich Black</span></span>
                <span class="search-tag" data-query="khqr"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M3 10.5h18"/></svg><span>KHQR</span></span>
            </div>

        <!-- Category Tabs -->
        <div id="tabs" class="tabs-container" role="tablist">
            <span id="tabIndicator" class="tab-indicator" aria-hidden="true"></span>
            <button type="button" class="tab-btn active" role="tab" aria-selected="true" data-category="all"><span data-i18n="cat.all">All</span> <span class="tab-count" data-count="all"></span></button>
            <button type="button" class="tab-btn" role="tab" aria-selected="false" data-category="favorites"><span class="tab-star" aria-hidden="true"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="vertical-align:-1px;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span> <span data-i18n="cat.favorites">Favorites</span> <span class="tab-count" data-count="favorites"></span></button>
            <button type="button" class="tab-btn" role="tab" aria-selected="false" data-category="prepress"><span data-i18n="cat.prepress">Prepress</span> <span class="tab-count" data-count="prepress"></span></button>
            <button type="button" class="tab-btn" role="tab" aria-selected="false" data-category="layout"><span data-i18n="cat.layout">Layout</span> <span class="tab-count" data-count="layout"></span></button>
            <button type="button" class="tab-btn" role="tab" aria-selected="false" data-category="utilities"><span data-i18n="cat.utilities">Utilities</span> <span class="tab-count" data-count="utilities"></span></button>
        </div>

        <!-- Recent Tools Quick Strip -->
        <div id="recentToolsWrap" class="recent-tools-wrap" hidden>
            <span class="recent-tools-label" data-i18n="recent.label">Recent:</span>
            <div id="recentToolsList" class="recent-tools-list"></div>
            <button type="button" id="recentClearBtn" class="recent-clear-btn" data-i18n-title="recent.clear" title="Clear Recent Tools">&times;</button>
        </div>

        <!-- Tool Card List (rendered by js/main.js) -->
        <main id="toolList" class="tool-list" role="tabpanel"></main>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" hidden>
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <p id="emptyText"></p>
            <div id="emptySuggestion" class="empty-suggestion" hidden></div>
            <button type="button" id="emptyClearBtn" class="empty-clear-btn" data-i18n="empty.clear" data-i18n-title="empty.clearTitle">Clear search</button>
        </div>
    </div>

    <!-- Embedded Tool View (controls directly inside the dock panel) -->
    <div id="viewEmbedded" class="view-embedded" style="display: none;">
        <div class="embedded-header" id="embeddedHeader">
            <div class="embedded-nav-group">
                <button type="button" id="embeddedBackBtn" class="embedded-back-btn" data-i18n-title="back.title" title="Back to Tools (Esc)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span data-i18n="back.tools">Tools</span>
                </button>
                <button type="button" id="embeddedPrevBtn" class="embedded-nav-arrow" title="Previous Tool (Ctrl+[)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
                <button type="button" id="embeddedNextBtn" class="embedded-nav-arrow" title="Next Tool (Ctrl+])"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
            </div>
            <div class="embedded-title-wrap">
                <span id="embeddedToolIcon" class="embedded-tool-icon" aria-hidden="true"></span>
                <span id="embeddedToolTitle" class="embedded-tool-title"></span>
            </div>
            <div class="embedded-quick-canvas" role="toolbar" aria-label="Quick Canvas Controls">
                <button type="button" class="embed-canvas-btn" data-canvas-cmd="fitin" title="Fit Active Artboard (Ctrl+0)">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
                <button type="button" class="embed-canvas-btn" data-canvas-cmd="fitall" title="Fit All Artboards (Ctrl+Alt+0)">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="9" height="9" rx="1"/><rect x="13" y="2" width="9" height="9" rx="1"/><rect x="2" y="13" width="9" height="9" rx="1"/><rect x="13" y="13" width="9" height="9" rx="1"/></svg>
                </button>
            </div>
            <button type="button" id="embeddedResetBtn" class="embedded-dialog-btn" data-i18n-title="reset.title" title="Reset tool defaults">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                </svg>
                <span data-i18n="reset.label">Reset</span>
            </button>
            <button type="button" id="embeddedDialogBtn" class="embedded-dialog-btn" data-i18n-title="open.dialogTitle" title="Open as Floating Window Dialog">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <line x1="10" y1="14" x2="21" y2="3"></line>
                </svg>
                <span data-i18n="open.dialog">Dialog</span>
            </button>
        </div>

        <!-- Live Selection & Artboard Context Ribbon -->
        <div id="embeddedSelRibbon" class="embedded-sel-ribbon" hidden>
            <span id="embeddedSelIcon" class="sel-ribbon-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M3 9h18M9 3v18"/></svg></span>
            <span id="embeddedSelText" class="sel-ribbon-text"></span>
            <button type="button" class="sel-ribbon-btn" data-canvas-cmd="fitin" title="Fit Active Artboard (Ctrl+0)">Fit Artboard</button>
        </div>

        <!-- Tool Presets Strip -->
        <div id="embedPresetsWrap" class="embed-presets-wrap" hidden>
            <span class="embed-presets-label">Presets</span>
            <div id="embedPresetsList" class="embed-presets-list"></div>
        </div>

        <div id="embeddedContent" class="embedded-content"></div>
    </div>

    <!-- Tool Preview Panel (rendered by js/main.js openPreviewPanel) -->
    <div id="viewPreview" class="view-preview" role="region" aria-label="Tool Preview"></div>

    <!-- Document Quick Actions Popover -->
    <div id="docPopover" class="doc-popover" hidden>
        <div class="doc-popover-header">
            <span class="doc-popover-title" id="docPopoverTitle">Document Inspector</span>
            <button type="button" id="docPopoverClose" class="doc-popover-close" aria-label="Close">&times;</button>
        </div>
        <div class="doc-popover-body">
            <div class="doc-popover-stats" id="docPopoverStats"></div>
            <div class="doc-popover-actions">
                <button type="button" class="doc-action-btn" data-canvas-cmd="fitin" title="Fit Active Artboard in Window (Ctrl+0)">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="3"/></svg>
                    <span>Fit Artboard</span>
                </button>
                <button type="button" class="doc-action-btn" data-canvas-cmd="fitall" title="Fit All Artboards in Window (Ctrl+Alt+0)">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="9" height="9" rx="1"/><rect x="13" y="2" width="9" height="9" rx="1"/><rect x="2" y="13" width="9" height="9" rx="1"/><rect x="13" y="13" width="9" height="9" rx="1"/></svg>
                    <span>Fit All</span>
                </button>
                <button type="button" class="doc-action-btn" data-canvas-cmd="actualsize" title="Actual Size 100% Zoom (Ctrl+1)">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    <span>100% Zoom</span>
                </button>
                <button type="button" class="doc-action-btn" data-canvas-cmd="selectall" title="Select All Artwork (Ctrl+A)">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/></svg>
                    <span>Select All</span>
                </button>
                <button type="button" class="doc-action-btn" data-canvas-cmd="deselectall" title="Deselect All Artwork (Ctrl+Shift+A)">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    <span>Deselect</span>
                </button>
                <button type="button" class="doc-action-btn" data-canvas-cmd="inverse" title="Invert Selection (Ctrl+Shift+I)">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
                    <span>Invert</span>
                </button>
            </div>
            <!-- Artwork Operations -->
            <div class="doc-popover-subtitle">Artwork Operations</div>
            <div class="doc-popover-actions doc-art-actions">
                <button type="button" class="doc-action-btn" data-canvas-cmd="unlockAll" title="Unlock All Locked Objects (Ctrl+Alt+2)">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
                    <span>Unlock All</span>
                </button>
                <button type="button" class="doc-action-btn" data-canvas-cmd="showAll" title="Show All Hidden Objects (Ctrl+Alt+3)">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    <span>Show All</span>
                </button>
                <button type="button" class="doc-action-btn" data-canvas-cmd="group" title="Group Selection (Ctrl+G)">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                    <span>Group</span>
                </button>
                <button type="button" class="doc-action-btn" data-canvas-cmd="ungroup" title="Ungroup Selection (Ctrl+Shift+G)">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                    <span>Ungroup</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom Footer -->
    <footer class="panel-footer">
        <div class="status-indicator" role="status" aria-live="polite" aria-atomic="true">
            <span id="statusDot" class="status-dot"></span>
            <span id="statusMessage">Ready</span>
        </div>
        <div class="footer-links">
            <button type="button" id="brandBadge" class="brand-badge" data-i18n-title="badge.title">v2.6.45</button>
            <button type="button" id="donateBtn" class="donate-link" data-i18n-title="donate.title" title="Support developer via ABA Pay">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="#e0245e" stroke="none" style="vertical-align:-1px;margin-right:2px;" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span data-i18n="donate.text">Donate</span>
            </button>
        </div>
    </footer>

    <!-- Shortcuts Cheat Sheet Modal -->
    <div id="shortcutsModal" class="shortcuts-modal" hidden>
        <div class="shortcuts-backdrop" id="shortcutsBackdrop"></div>
        <div class="shortcuts-dialog" role="dialog" aria-modal="true" aria-labelledby="shortcutsTitle">
            <div class="shortcuts-header">
                <span id="shortcutsTitle" class="shortcuts-title" data-i18n="shortcuts.heading">Keyboard Shortcuts</span>
                <button type="button" id="shortcutsCloseBtn" class="shortcuts-close" aria-label="Close">&times;</button>
            </div>
            <div class="shortcuts-body" id="shortcutsBody"></div>
        </div>
    </div>

    <!-- Custom Modal Alert / Confirm Dialog -->
    <div id="alertModal" class="alert-modal" hidden>
        <div class="alert-backdrop" id="alertBackdrop"></div>
        <div class="alert-dialog" role="alertdialog" aria-modal="true" aria-labelledby="alertModalTitle" aria-describedby="alertModalMessage">
            <div class="alert-dialog-header">
                <span id="alertModalIcon" class="alert-modal-icon"></span>
                <span id="alertModalTitle" class="alert-modal-title">Alert</span>
            </div>
            <div id="alertModalMessage" class="alert-modal-message"></div>
            <div class="alert-dialog-actions">
                <button type="button" id="alertModalCancelBtn" class="alert-modal-btn alert-btn-secondary" hidden>Cancel</button>
                <button type="button" id="alertModalOkBtn" class="alert-modal-btn alert-btn-primary">OK</button>
            </div>
        </div>
    </div>

    <script src="js/CSInterface.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
